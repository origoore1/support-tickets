# Lindgren-X v2.0 Connector Specification
# Bureau of Land Management - Nevada Mining Claims

metadata:
  name: "US BLM Nevada Mining Claims"
  version: "1.0.0"
  author: "Lindgren-X"
  description: "Extracts mining claim data from BLM Nevada public datasets"
  last_updated: "2024-01-15"

source:
  name: "Bureau of Land Management - Nevada"
  country_code: "USA"
  region: "Nevada"
  type: "government"
  url: "https://www.blm.gov/programs/energy-and-minerals/mining-and-minerals/locatable-minerals/mining-claims"
  data_format: "Shapefile (ZIP)"
  update_frequency: "monthly"

extraction:
  method: "api"
  api:
    # Updated to query all claims including expired/closed/abandoned
    # Using base service without "Not_Closed" filter
    url: "https://gis.blm.gov/arcgis/rest/services/lands/BLM_Natl_MLRS/MapServer/0/query?where=1%3D1&outFields=*&f=geojson"
    page_size: 1000
    max_records: 10000

  # Optional: Filter for specific statuses after retrieval
  filters:
    status:
      include:
        - "Expired"
        - "Forfeited"
        - "Closed"
        - "Abandoned"
        - "Active"  # Include active for comparison/validation

# Field mappings: How to map source fields to harmonized schema
field_mappings:
  # Required fields
  external_id: "properties.CSE_NR"
  claim_type: "properties.BLM_PROD"
  claim_status: "properties.CSE_DISP"
  commodity: "properties.CSE_TYPE_NR"

  # Geographic fields
  region: "Nevada"
  location_name: "properties.CSE_NAME"
  geometry: "geometry"
  area: "properties.RCRD_ACRS"
  area_unit: "acres"

  # Temporal fields
  filing_date: "properties.Created"
  expiry_date: null
  last_activity_date: "properties.Modified"

  # Ownership fields
  holder_name: null

  # Economic fields
  work_required: null
  fees_due: null

# Data transformation rules
transformations:
  status_mapping:
    "Active": "active"
    "Expired": "expired"
    "Closed": "closed"
    "Forfeited": "abandoned"
    "Pending": "pending"

  claim_type_mapping:
    "Lode": "mineral"
    "Placer": "placer"
    "Mill Site": "mill_site"
    "Tunnel Site": "tunnel_site"

# Data quality rules
validation:
  required_fields:
    - "CASE_ID"
    - "STATUS"
    - "CLAIM_NAME"

  skip_if:
    - condition: "STATUS == 'Cancelled'"
      reason: "Cancelled claims are not investment opportunities"

# Scoring hints (used by MineScore algorithm)
scoring_hints:
  geological:
    commodity_scores:
      gold: 35
      silver: 30
      copper: 28
      lithium: 35
      rare_earth: 35
      default: 20

  historical:
    has_production_history: 25
    exploration_only: 15
    no_history: 10

  jurisdiction:
    nevada_score: 15  # Nevada is mining-friendly

notes: |
  Nevada BLM mining claims data is publicly available and updated monthly.
  This connector extracts all claims and filters for expired/abandoned claims
  suitable for acquisition.

  Data Source: BLM Nevada ArcGIS Services
  License: Public Domain
  Update Schedule: Monthly (1st of each month)
